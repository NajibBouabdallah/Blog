<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Blog Project</title>
    <style>
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: #2563eb;
            color: white;
            padding: 8px;
            z-index: 100;
            text-decoration: none;
            border-radius: 0 0 4px 0;
        }
        .skip-link:focus {
            top: 0;
            outline: 2px solid #2563eb;
            outline-offset: 2px;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            line-height: 1.5;
            margin: 2rem;
            max-width: 800px;
            margin-inline: auto;
            color: #1f2937;
        }
        h1 { color: #111827; }
    </style>
</head>
<body>
    <a href="#main" class="skip-link">Skip to content</a>
    <header>
        <h1>The Blog Project</h1>
    </header>
    <main id="main" tabindex="-1">
        <p>A space for high-quality content and seamless UX. Welcome to our accessible blogging platform.</p>
    </main>
</body>
</html>
