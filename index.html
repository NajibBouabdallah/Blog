<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Blog</title>
    <style>
        :root { color-scheme: light dark; --accent: #2563eb; --border: #e5e7eb; }
        @media (prefers-color-scheme: dark) { :root { --border: #374151; } }
        body { font-family: system-ui, sans-serif; line-height: 1.5; padding: 2rem; max-width: 800px; margin: 0 auto; }
        .skip-link { position: absolute; top: 0; left: 0; background: var(--accent); color: #fff; padding: 8px; transform: translateY(-100%); transition: transform 0.2s; }
        .skip-link:focus { transform: translateY(0); }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 2rem; }
        button { background: transparent; border: none; padding: 4px; border-radius: 4px; cursor: pointer; display: flex; transition: background 0.2s, transform 0.1s; }
        button:hover { background: rgba(128, 128, 128, 0.1); }
        button:active { transform: scale(0.9); }
        #main:focus { outline: none; }
    </style>
</head>
<body>
    <a href="#main" class="skip-link">Skip to content</a>
    <header><h1>Blog</h1><button aria-label="Menu" type="button"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button></header>
    <main id="main" tabindex="-1"><p>A space for high-quality content and seamless UX.</p></main>
</body>
</html>
