<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blog</title>
    <style>
        :root {
            color-scheme: light dark;
            font-family: system-ui, sans-serif;
            --border: #ccc;
            --feedback: #16a34a;
            --btn-bg: #3b82f6;
            --btn-hover: #2563eb;
            --focus-ring: #3b82f6;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --border: #444;
                --feedback: #4ade80;
                --btn-bg: #2563eb;
                --btn-hover: #1d4ed8;
                --focus-ring: #60a5fa;
            }
        }
        .skip { position: absolute; transform: translateY(-100%); transition: transform 0.2s; background: var(--btn-bg); color: white; padding: 0.5rem; z-index: 100; }
        .skip:focus { transform: translateY(0); }

        button:active:not(:disabled) { transform: scale(0.95); }
        button:focus-visible, input:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

        header, footer { padding: 1rem; border-bottom: 1px solid var(--border); }
        footer { border-top: 1px solid var(--border); border-bottom: none; }
        main { padding: 2rem; }

        .sub-form { display: flex; flex-direction: column; gap: 0.5rem; max-width: 320px; margin-top: 1.5rem; }
        .sub-group { display: flex; gap: 0.5rem; }

        .sub-input { flex: 1; padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px; background: transparent; color: inherit; transition: border-color 0.2s; }
        .sub-input:disabled { opacity: 0.6; cursor: not-allowed; background: rgba(0, 0, 0, 0.05); }
        @media (prefers-color-scheme: dark) {
            .sub-input:disabled { background: rgba(255, 255, 255, 0.05); }
        }

        .sub-btn { background: var(--btn-bg); color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; transition: background 0.2s, transform 0.1s, opacity 0.2s; }
        .sub-btn:hover:not(:disabled) { background: var(--btn-hover); }
        .sub-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .spinner { width: 12px; height: 12px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .feedback { font-size: 0.9rem; color: var(--feedback); min-height: 1.5rem; margin-top: 0.25rem; font-weight: 500; }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <header role="banner"><nav><strong>Blog</strong></nav></header>
    <main id="main" role="main">
        <h1>Welcome</h1>
        <p>An accessible reading experience.</p>
        <form id="sub-form" class="sub-form">
            <label for="sub-email"><strong>Subscribe to our newsletter</strong></label>
            <div class="sub-group">
                <input id="sub-email" type="email" required placeholder="you@example.com" class="sub-input">
                <button type="submit" class="sub-btn">
                    <span>Subscribe</span>
                    <span class="spinner" hidden></span>
                </button>
            </div>
            <div id="feedback" role="status" aria-live="polite" class="feedback"></div>
        </form>
    </main>
    <footer role="contentinfo"><p>&copy; 2024 Blog</p></footer>
    <script>
        document.getElementById('sub-form')?.addEventListener('submit', (e) => {
            e.preventDefault();
            const form = e.target, input = form.querySelector('input'), btn = form.querySelector('button'), spin = form.querySelector('.spinner'), feedback = document.getElementById('feedback');
            input.disabled = btn.disabled = true; spin.hidden = false; feedback.textContent = '';
            setTimeout(() => {
                input.disabled = btn.disabled = false; spin.hidden = true;
                feedback.textContent = 'Thanks for subscribing!'; form.reset();
            }, 1000);
        });
    </script>
</body>
</html>
