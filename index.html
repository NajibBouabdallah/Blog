<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Blog Project</title>
    <style>
        :root {
            color-scheme: light dark;
            --accent: #2563eb;
            --border: #e5e7eb;
            --focus-ring: #2563eb;
            --hover-bg: rgba(0, 0, 0, 0.05);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --accent: #60a5fa;
                --border: #374151;
                --focus-ring: #60a5fa;
                --hover-bg: rgba(255, 255, 255, 0.1);
            }
        }
        body { font-family: system-ui, sans-serif; line-height: 1.5; margin: 0; padding: 2rem; max-width: 800px; margin: 0 auto; }

        /* Skip link */
        .skip-link { position: absolute; top: 0; left: 0; background: var(--accent); color: #fff; padding: 8px; transform: translateY(-100%); transition: transform 0.2s; z-index: 100; }
        .skip-link:focus { transform: translateY(0); }

        /* Header & Button micro-UX styles */
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 1.5rem; }
        header button {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.5rem;
            cursor: pointer;
            color: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, transform 0.1s, border-color 0.2s;
        }
        header button:hover { background-color: var(--hover-bg); }
        header button:active { transform: scale(0.95); }

        /* Focus visible outline matching theme colors */
        header button:focus-visible, .nav-menu a:focus-visible, .skip-link:focus-visible {
            outline: 2px solid var(--focus-ring);
            outline-offset: 2px;
        }

        /* Navigation Menu styles & Animation */
        .nav-menu {
            border-bottom: 1px solid var(--border);
            padding-bottom: 1.5rem;
            margin-bottom: 1.5rem;
            animation: slideDown 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .nav-menu ul { list-style: none; padding: 0; margin: 0; display: flex; gap: 1.5rem; }
        .nav-menu a {
            color: inherit;
            text-decoration: none;
            font-weight: 500;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            transition: background-color 0.2s, color 0.2s;
        }
        .nav-menu a:hover { background-color: var(--hover-bg); color: var(--accent); }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <a href="#main" class="skip-link">Skip to content</a>
    <header>
        <h1>The Blog Project</h1>
        <button aria-label="Toggle menu" aria-expanded="false" aria-controls="nav-menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
    </header>
    <nav id="nav-menu" class="nav-menu" hidden aria-label="Main Navigation">
        <ul>
            <li><a href="#main">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>
    <main id="main">
        <p>A space for high-quality content, seamless UX, and uncompromising accessibility.</p>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuBtn = document.querySelector('header button');
            const navMenu = document.getElementById('nav-menu');

            if (menuBtn && navMenu) {
                // Click toggle logic
                menuBtn.addEventListener('click', () => {
                    const isExpanded = menuBtn.getAttribute('aria-expanded') === 'true';
                    menuBtn.setAttribute('aria-expanded', !isExpanded);
                    navMenu.hidden = isExpanded;
                });

                // Keyboard escape to close menu
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape' && menuBtn.getAttribute('aria-expanded') === 'true') {
                        menuBtn.setAttribute('aria-expanded', 'false');
                        navMenu.hidden = true;
                        menuBtn.focus();
                    }
                });
            }
        });
    </script>
</body>
</html>
