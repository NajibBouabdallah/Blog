<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Blog</title>
    <style>
        :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
        body { max-width: 600px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
        .skip-link { position: absolute; top: -40px; left: 0; background: #2563eb; color: white; padding: 8px; z-index: 100; transition: top 0.2s; }
        .skip-link:focus { top: 0; }
        button:focus-visible, a:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
    </style>
</head>
<body>
    <a href="#main" class="skip-link">Skip to content</a>
    <header style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid currentColor; padding-bottom: 1rem;">
        <h1>The Blog</h1>
    </header>
    <main id="main" tabindex="-1" style="margin-top: 1.5rem;">
        <p>A space for high-quality content, seamless UX, and uncompromising accessibility.</p>
    </main>
</body>
</html>
